name: Update MasterTV V2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MasterTV
        run: python update_master.py --real-epg --max-epg-sources 120

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site/output
          cp -R static/* site/
          cp output/master.m3u site/output/
          cp output/epg.xml site/output/
          cp output/channels.json site/output/
          cp output/groups.json site/output/
          cp output/group_sections.json site/output/
          cp output/epg_index.json site/output/
          cp output/stats.json site/output/

      - name: Commit refreshed MasterTV data
        run: |
          git config user.name "MasterTV Bot"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git diff --cached --quiet || git commit -m "Auto-update MasterTV V2"
          git push

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Update MasterTV V2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate fresh MasterTV channels and EPG
        run: |
          python update_master.py --real-epg --max-epg-sources 120

      - name: Verify generated data
        run: |
          echo "Generated files:"
          ls -lh output
          echo "Channel count:"
          python - <<'PY'
          import json
          with open("output/channels.json", encoding="utf-8") as f:
              channels = json.load(f)
          print(len(channels))
          if len(channels) == 0:
              raise SystemExit("ERROR: No channels generated")
          PY

      - name: Prepare MasterTV website
        run: |
          mkdir -p site/output

          cp index.html site/
          cp app.js site/
          cp styles.css site/
          cp manifest.webmanifest site/
          cp sw.js site/

          cp output/channels.json site/output/
          cp output/groups.json site/output/
          cp output/group_sections.json site/output/
          cp output/epg_index.json site/output/
          cp output/epg.xml site/output/
          cp output/master.m3u site/output/
          cp output/stats.json site/output/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy MasterTV
        id: deployment
        uses: actions/deploy-pages@v4

name: Update MasterTV V2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MasterTV
        run: python update_master.py --real-epg --max-epg-sources 120

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p site
          cp index.html site/
          cp app.js site/
          cp styles.css site/
          cp manifest.webmanifest site/
          cp sw.js site/
          cp master.m3u site/
          cp epg.xml site/
          cp channels.json site/
          cp groups.json site/
          cp group_sections.json site/
          cp epg_index.json site/
          cp stats.json site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

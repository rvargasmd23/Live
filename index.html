<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>MasterTV Fusion</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Home"><span class="brand-mark">M</span><span>MasterTV</span><b>FUSION</b></button>
    <div class="search-shell">
      <span>⌕</span><input id="search" placeholder="Search channels, teams, countries, movies…" autocomplete="off" />
      <button id="clearSearch" class="iconbtn" aria-label="Clear search">✕</button>
    </div>
    <button id="sourceBtn" class="pillbtn">Sources</button>
  </header>

  <div id="teslaNotice" class="notice hidden">Tesla mode: video on the front display remains subject to Tesla's Park restrictions. Rear-screen behavior is controlled by the vehicle.</div>

  <section id="sourcePanel" class="source-panel hidden">
    <div class="source-panel-head"><div><strong>Live sources</strong><small>Public/free feeds + your authorized sources</small></div><button id="closeSources" class="iconbtn">✕</button></div>
    <div id="sourceList" class="source-list"></div>
  </section>

  <main>
    <aside id="groups" aria-label="Categories"></aside>
    <section class="content">
      <div id="homeView" class="home-view hidden"></div>

      <div id="playerCard" class="player-card hidden">
        <div class="video-wrap"><video id="video" controls playsinline webkit-playsinline></video><div id="playerStatus" class="player-status hidden"></div></div>
        <div class="now-info">
          <div class="channel-row"><img id="nowLogo" alt=""/><div><div class="eyebrow" id="nowSource"></div><h2 id="nowName"></h2><div id="nowMeta" class="muted"></div></div></div>
          <div class="player-actions"><button id="nowFav" class="primary">☆ Favorite</button><button id="openStream" class="secondary">Open stream ↗</button></div>
        </div>
        <div class="epg-panel">
          <div class="epg-line"><span class="epg-label">NOW</span><div><strong id="epgNowTitle">Loading guide…</strong><div id="epgNowTime" class="muted"></div></div></div>
          <div class="epg-line"><span class="epg-label">NEXT</span><div><strong id="epgNextTitle">—</strong><div id="epgNextTime" class="muted"></div></div></div>
        </div>
      </div>

      <div id="listingView">
        <div class="toolbar"><div><div class="eyebrow" id="viewEyebrow">LIVE TV</div><div id="viewTitle">📺 ALL CHANNELS</div></div><div id="resultCount"></div></div>
        <div id="activeFilters" class="filter-row"></div>
        <div id="grid" class="grid"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Quick navigation">
    <button data-nav="🏠 HOME">⌂<span>Home</span></button>
    <button data-nav="🇵🇷 PUERTO RICO">🇵🇷<span>Puerto Rico</span></button>
    <button data-nav="🏆 SPORTS">🏆<span>Sports</span></button>
    <button data-nav="🎬 MOVIES">🎬<span>Movies</span></button>
    <button data-nav="⭐ FAVORITES">★<span>Favorites</span></button>
  </nav>

  <template id="cardTpl">
    <button class="card">
      <div class="logo-wrap"><img class="logo" alt="" /></div>
      <div class="card-body"><div class="name"></div><div class="meta"></div><div class="epg-mini"></div><div class="source-badge"></div></div>
      <div class="star">☆</div>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="app.js"></script>
</body>
</html>

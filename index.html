<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>MasterTV V2</title>
</head>
<body>
  <header>
    <div class="brand">MasterTV <span>V2</span></div>
    <input id="search" placeholder="Search channels, countries, sports…" autocomplete="off" />
    <button id="clearSearch" class="iconbtn" aria-label="Clear search">✕</button>
  </header>

  <div id="teslaNotice" class="notice hidden">
    Tesla: front-screen video is for Park. Rear-screen playback may continue while driving where supported by the vehicle.
  </div>

  <main>
    <aside id="groups" aria-label="Categories"></aside>
    <section class="content">
      <div id="playerCard" class="player-card hidden">
        <div class="video-wrap"><video id="video" controls playsinline></video></div>
        <div class="now-info">
          <div class="channel-row"><img id="nowLogo" alt=""/><div><h2 id="nowName"></h2><div id="nowMeta"></div></div></div>
          <div class="player-actions"><button id="nowFav" class="primary">☆ Favorite</button></div>
        </div>
        <div class="epg-panel">
          <div class="epg-line"><span class="epg-label">NOW</span><div><strong id="epgNowTitle">Loading guide…</strong><div id="epgNowTime" class="muted"></div></div></div>
          <div class="epg-line"><span class="epg-label">NEXT</span><div><strong id="epgNextTitle">—</strong><div id="epgNextTime" class="muted"></div></div></div>
        </div>
      </div>
      <div class="toolbar"><div id="viewTitle">📺 ALL CHANNELS</div><div id="resultCount"></div></div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <template id="cardTpl">
    <button class="card">
      <div class="logo-wrap"><img class="logo" alt="" /></div>
      <div class="card-body"><div class="name"></div><div class="meta"></div><div class="epg-mini"></div></div>
      <div class="star">☆</div>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="app.js"></script>
</body>
</html>
